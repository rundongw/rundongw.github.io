{{- /* Secret entrance to the blog: type the word below anywhere on the site. */ -}}
<script>
(function () {
  var secretWord = "storm"; // change this to whatever you like
  var target = "{{ "blog" | relURL }}";
  var buffer = "";

  document.addEventListener("keydown", function (e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    if (e.key.length !== 1) return; // ignore Shift, Enter, arrows, etc.

    var tag = (document.activeElement && document.activeElement.tagName || "").toLowerCase();
    if (tag === "input" || tag === "textarea") return;

    buffer = (buffer + e.key.toLowerCase()).slice(-secretWord.length);
    if (buffer === secretWord) {
      window.location.href = target;
    }
  });
})();
</script>
